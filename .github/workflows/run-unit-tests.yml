name: Run Unit Tests

on: [push]

jobs: 
  run-unit-tests:
    name: Generate Prisma Client
    run: npx prisma generate
    
    name: Run Unit Tests
    runs-on: ubuntu-latest    
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 24
          cache: 'npm'
      
      - run: npm ci

      - run: npm run test